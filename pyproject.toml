[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esa-audit"
version = "0.1.0"
description = "Audit a text classifier of violent-extremist content with a two-artifact contract: probabilities and word-level SHAP attributions."
readme = "README.md"
requires-python = ">=3.10"
# No licence is declared yet: it needs the co-authors' sign-off. The classifier
# below stops an accidental upload to a public index until it is chosen.
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The audit core: reading the artifacts, the statistics, the report cards and
# the local page. Nothing here needs a GPU or a deep-learning framework.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.4",
]

[project.optional-dependencies]
# Re-scoring edited texts and restoring predictors (the perturbation stages).
perturbation = ["shap>=0.46", "torch>=2.2", "transformers>=4.34", "gensim>=4.3"]
# Fetching recorded external assets from Kaggle.
kaggle = ["kaggle"]
dev = ["pytest>=8"]

[project.scripts]
esa-audit = "esa_audit.audit:main"
esa-audit-gui = "esa_audit.audit_gui:main"

[tool.setuptools]
# The modules live in tools/ and are installed as the package esa_audit.
package-dir = { "esa_audit" = "tools" }
packages = ["esa_audit"]

[tool.setuptools.package-data]
esa_audit = [
    "audit_gui_static/*.html",
    "audit_gui_static/*.css",
    "audit_gui_static/*.js",
    "audit_gui_static/fonts/*",
]
